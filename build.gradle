plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()

    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }

    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
    }
      maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "inverted_realm" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:4.4.9"

    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


    // TerraBlender Fabric 1.20.1
    modImplementation "curse.maven:terrablender-fabric-565956:4590486"


    // TerraBlender dependency
    modImplementation "com.electronwill.night-config:core:3.6.7"
    modImplementation "com.electronwill.night-config:toml:3.6.7"
}


processResources {

    def version = project.version

    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}


tasks.withType(JavaCompile).configureEach {

    it.options.release = 17

}


java {

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17

    targetCompatibility = JavaVersion.VERSION_17

}


jar {

    def projectName = project.name

    inputs.property "projectName", projectName

    from("LICENSE") {

        rename { "${it}_${projectName}" }

    }

}


publishing {

    publications {

        create("mavenJava", MavenPublication) {

            from components.java

        }

    }

}